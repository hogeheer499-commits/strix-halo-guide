<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if page.seo.date_modified %}<meta property="article:modified_time" content="{{ page.seo.date_modified | date_to_xmlschema }}">{% endif %}
  <meta name="google-site-verification" content="efeA7xFEC9YOrHAsVi-TBQXbMJTpvZw4wKHQb8HS_2I">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
      color: #111827;
      background: #ffffff;
    }
    a {
      color: #0969da;
    }
    a:focus-visible {
      outline: 3px solid #58a6ff;
      outline-offset: 3px;
    }
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1rem;
      color: #ffffff;
      background: #0d1117;
    }
    .skip-link:focus {
      left: 1rem;
      top: 1rem;
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    pre {
      overflow-x: auto;
      padding: 1rem;
      background: #f3f4f6;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      overflow-x: auto;
      display: block;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 0.5rem;
      vertical-align: top;
    }
    blockquote {
      border-left: 4px solid #d1d5db;
      padding-left: 1rem;
      color: #374151;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #d1d5db;
      color: #4b5563;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to the guide</a>
  <main id="main-content">
    {{ content }}
  </main>
  <footer>
    Independent AMD Strix Halo setup and benchmark evidence.
    <a href="https://github.com/hogeheer499-commits/strix-halo-guide">View the canonical GitHub repository and raw evidence.</a>
  </footer>
</body>
</html>
