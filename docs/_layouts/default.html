<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
      color: #111827;
      background: #ffffff;
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    pre {
      overflow-x: auto;
      padding: 1rem;
      background: #f3f4f6;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      overflow-x: auto;
      display: block;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 0.5rem;
      vertical-align: top;
    }
    blockquote {
      border-left: 4px solid #d1d5db;
      padding-left: 1rem;
      color: #374151;
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
