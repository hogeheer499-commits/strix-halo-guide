<text x="510.0" y="494" text-anchor="middle" class="tick">2500 MHz</text>
<text x="724.0" y="494" text-anchor="middle" class="tick">2600 MHz</text>
<text x="938.0" y="494" text-anchor="middle" class="tick">Stock</text>
<polyline fill="none" stroke="#1f77b4" stroke-width="3" points="82.0,315.9 296.0,284.6 510.0,266.0 724.0,244.8 938.0,243.3"/>
