</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="82" y="40" class="title">Corsair fleet: socket power and edge temperature</text>
<text x="82" y="64" class="subtitle">Strict 30-minute-under-load soaks; stock is auto mode with a 2900 MHz ceiling</text>
